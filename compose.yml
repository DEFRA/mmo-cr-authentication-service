services:
  mmo-cr-authentication-service:
    build:
      context: .
      target: development
    ports:
      - '3004:3001'
    environment:
      PORT: 3001
      NODE_ENV: development
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
      - ./.env:/home/node/.env